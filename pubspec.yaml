name: app_copa_do_mundo
description: App Copa do Mundo — jogos em tempo real, tabelas e assinatura premium.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # HTTP
  dio: ^5.7.0

  # Cache local
  hive_flutter: ^1.1.0

  # Navegação
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.13.0
  firebase_analytics: ^11.4.4
  firebase_remote_config: ^5.4.4
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2

  # Ads
  google_mobile_ads: ^5.3.0

  # Assinatura
  in_app_purchase: ^3.2.0

  # UI / Ícones
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.8.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  injectable_generator: ^2.7.0
  build_runner: ^2.4.13

  # Testes
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
